[package]
name = "agentmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Herdr-inspired agent sidebar for tmux"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
ansi-to-tui = { version = "7.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.29"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
