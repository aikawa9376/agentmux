<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentmux Mirror</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;font-family:system-ui;background:#1e1e2e;color:#cdd6f4}body{margin:0;padding:16px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px}button,input,select{font:inherit;padding:10px;border:1px solid #585b70;border-radius:8px;background:#313244;color:inherit}input{max-width:90%}button{cursor:pointer}#status{color:#a6adc8}main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;margin-top:16px}#agents{display:flex;flex-direction:column;gap:8px}#agents button{text-align:left;white-space:pre-wrap}#agents button[aria-pressed=true]{border-color:#89b4fa;background:#45475a}#screen{margin:0;overflow:auto;max-height:80vh;background:#11111b;padding:12px;border-radius:8px;tab-size:8;font:13px/1.35 monospace;white-space:pre}#label{font-size:15px;overflow-wrap:anywhere}#pair{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){main{grid-template-columns:1fr}#agents{flex-direction:row;overflow:auto}#agents button{min-width:160px}#screen{max-height:65vh}}
</style>
<header><h1>Agentmux Mirror</h1><span id="status" role="status">未接続</span><button id="disconnect">切断</button></header>
<form id="pair"><input id="token" type="password" placeholder="PCに表示された接続トークン" autocomplete="off" required aria-label="接続トークン"><button>接続</button></form>
<main><nav id="agents" aria-label="Agents"></nav><section><h2 id="label">Agentを選択してください</h2><pre id="screen" tabindex="0"></pre></section></main>
<script src="/mirror.js"></script></html>
