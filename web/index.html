<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agentmux Mirror</title>
<style>
[hidden]{display:none!important}:root{color-scheme:dark;font-family:system-ui;background:#1e1e2e;color:#cdd6f4}body{margin:0;padding:16px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #585b70;border-radius:8px;background:#313244;color:inherit}input{max-width:90%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}textarea{box-sizing:border-box;width:100%;resize:vertical;min-height:90px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#compose{margin-top:12px}#action-status,#control-hint{font-size:13px;color:#a6adc8}#interrupt{border-color:#f38ba8}#toggle-agents{position:fixed;left:0;top:40%;z-index:5;width:24px;min-height:64px;padding:0;border-radius:0 10px 10px 0;border-left:0;font-size:26px;color:#89b4fa;box-shadow:2px 0 10px #0004}#agent-drawer{box-sizing:border-box;position:fixed;inset:0 auto 0 0;margin:0;width:min(320px,85vw);height:100dvh;max-height:100dvh;max-width:85vw;padding:16px;border:0;border-right:1px solid #45475a;background:#1e1e2e;color:#cdd6f4;transform:translateX(-100%);transition:transform 180ms ease;overflow-y:auto}#agent-drawer.shown{transform:translateX(0)}#agent-drawer::backdrop{background:#0008}#drawer-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}#drawer-heading h2{font-size:18px;margin:0}#close-agents{font-size:22px;padding:5px 12px}@media(prefers-reduced-motion:reduce){#agent-drawer{transition:none}}#status{color:#a6adc8}main{min-width:0;margin-top:16px;margin-left:12px}#agents{display:flex;flex-direction:column;gap:8px}#agents button{text-align:left;white-space:pre-wrap}#agents button[aria-pressed=true]{border-color:#89b4fa;background:#45475a}#screen{margin:0;overflow:auto;max-height:80vh;background:#11111b;padding:12px;border-radius:8px;tab-size:8;font:13px/1.35 monospace;white-space:pre}#label{font-size:15px;overflow-wrap:anywhere}#pair{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){main{grid-template-columns:1fr}#screen{max-height:65vh}}
</style>
<header><h1>Agentmux Mirror</h1><span id="status" role="status">未接続</span><button id="disconnect">切断</button></header>
<form id="pair"><input id="token" type="password" placeholder="PCに表示された接続トークン" autocomplete="off" required aria-label="接続トークン"><button>接続</button></form>
<button id="toggle-agents" aria-expanded="false" aria-controls="agent-drawer" aria-label="Agent一覧を開く" title="Agent一覧">›</button>
<dialog id="agent-drawer" aria-labelledby="drawer-title"><div id="drawer-heading"><h2 id="drawer-title">Agents</h2><button id="close-agents" aria-label="Agent一覧を閉じる">‹</button></div><nav id="agents" aria-label="Agents"></nav></dialog>
<main id="main"><section><div class="toolbar"><h2 id="label">Agentを選択してください</h2><button id="latest">最新へ</button></div><pre id="screen" tabindex="0"></pre>
<form id="compose"><label for="prompt">選択したAgentへの命令</label><textarea id="prompt" placeholder="命令を入力（Ctrl+Enterでも送信）" maxlength="12000" disabled></textarea>
<div class="toolbar"><button id="send" type="submit" disabled>命令を送る</button><button id="interrupt" type="button" disabled>実行を中断</button><span id="control-hint"></span></div></form><p id="action-status" role="status"></p></section></main>
<script src="/mirror.js"></script></html>
